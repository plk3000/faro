name: FARO

options:
  bundleIdPrefix: com.jdsolissmith
  developmentLanguage: en
  knownRegions:
    - en
    - es-MX
  deploymentTarget:
    iOS: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""

targets:
  FARO:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    sources:
      - path: FARO
        excludes:
          - Resources
      - path: FARO/Resources
        buildPhase: resources
    info:
      path: FARO/Info.plist
      properties:
        CFBundleDisplayName: FARO
        UILaunchScreen: {}
        NSCameraUsageDescription: FARO uses the camera to describe nearby scenes and remember places you choose.
        NSLocationWhenInUseUsageDescription: FARO uses coarse location to improve recognition of places you save.
        NSMicrophoneUsageDescription: FARO uses the microphone for foreground wake phrases and voice-command recording.
        NSSpeechRecognitionUsageDescription: FARO recognizes on-device wake phrases and transcribes commands such as describe and where am I.
        NSBluetoothAlwaysUsageDescription: FARO connects to its optional ESP32 obstacle module.
        FAROVisionMode: $(FARO_VISION_MODE)
        FAROVisionBaseURL: $(FARO_VISION_BASE_URL)
        FAROVisionToken: $(FARO_VISION_TOKEN)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jdsolissmith.faro
        PRODUCT_NAME: FARO
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - FAROTests
      gatherCoverageData: true

  FAROTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FAROTests
    dependencies:
      - target: FARO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jdsolissmith.faro.tests
        GENERATE_INFOPLIST_FILE: YES
